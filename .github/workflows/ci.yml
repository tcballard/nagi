name: Build and exercise Nagi
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified v0.0.2 release
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev pkg-config xvfb xauth dbus-x11 xdotool imagemagick desktop-file-utils python3-pil python3-gi python3-pyatspi
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Validate approved icon pixels
        run: python3 tests/icons.py
      - name: Check formatting
        run: |
          mkdir -p target/evidence
          cargo fmt --all
          git diff --binary -- src > target/evidence/format.patch
          git diff --exit-code -- src
      - run: cargo test --locked
      - run: cargo build --locked
      - run: python3 tests/config_transactions.py
      - run: python3 tests/extensions_cli.py
      - name: Validate desktop launcher
        run: desktop-file-validate packaging/io.github.tcballard.Nagi.desktop
      - name: Exercise real browser with local fixtures
        # Ubuntu's runner policy otherwise prevents WebKit from creating its
        # process sandbox. Allow namespaces on this disposable VM only; never
        # disable WebKit's sandbox or change the user's machine.
        run: |
          previous=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)
          trap 'sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns="$previous"' EXIT
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          GSK_RENDERER=cairo LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s '-screen 0 1280x900x24' dbus-run-session -- python3 tests/gui_smoke.py
          GSK_RENDERER=cairo LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s '-screen 0 1280x900x24' dbus-run-session -- python3 tests/control_smoke.py
          GSK_RENDERER=cairo LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s '-screen 0 1280x900x24' dbus-run-session -- python3 tests/extensions_smoke.py
      - name: Compile release
        run: cargo build --locked --release
      - name: Package runnable Linux build
        run: |
          mkdir -p dist/nagi-linux-x86_64
          cp target/release/nagi README.md LICENSE CREDITS.md dist/nagi-linux-x86_64/
          cp -r packaging assets dist/nagi-linux-x86_64/
          mkdir -p dist/nagi-linux-x86_64/scripts
          cp scripts/install-icons.sh dist/nagi-linux-x86_64/scripts/
          cp scripts/install-binary.sh dist/nagi-linux-x86_64/install.sh
          tar -C dist -czf dist/nagi-linux-x86_64.tar.gz nagi-linux-x86_64
          (cd dist && sha256sum nagi-linux-x86_64.tar.gz > SHA256SUMS)
      - name: Upload build and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nagi-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
            target/evidence/
          if-no-files-found: warn
  arch-package:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 30
    steps:
      - name: Install Arch build dependencies
        run: pacman -Syu --noconfirm --needed git rust pkgconf gtk4 webkitgtk-6.0
      - uses: actions/checkout@v4
      - name: Prepare immutable local source package
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          scripts/prepare-package.sh
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Build and test package as an ordinary user
        run: runuser -u builder -- bash -c 'cd "$1/dist" && makepkg --noconfirm' _ "$GITHUB_WORKSPACE"
      - name: Inspect package
        run: |
          pacman -Qip dist/*.pkg.tar.zst
          pacman -Qlp dist/*.pkg.tar.zst
          (cd dist && sha256sum ./*.pkg.tar.zst > ARCH-SHA256SUMS)
          pacman -U --noconfirm dist/*.pkg.tar.zst
          nagi --version
          test -f /usr/share/applications/io.github.tcballard.Nagi.desktop
          pacman -R --noconfirm nagi
          test ! -e /usr/bin/nagi
      - uses: actions/upload-artifact@v4
        with:
          name: nagi-arch-x86_64
          path: |
            dist/*.pkg.tar.zst
            dist/ARCH-SHA256SUMS
            dist/nagi-*.tar.gz
            dist/PKGBUILD

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: [linux, arch-package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: nagi-*
          merge-multiple: true
          path: release-artifacts
      - name: Publish v0.0.2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' files < <(find release-artifacts -type f \( -name '*.pkg.tar.zst' -o -name '*.tar.gz' -o -name '*SHA256SUMS' \) -print0)
          gh release create v0.0.2 --target "$GITHUB_SHA" --prerelease --title "Nagi v0.0.2" --notes-file RELEASE_NOTES.md "${files[@]}"

