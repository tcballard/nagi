[package]
name = "nagi"
version = "0.0.2"
edition = "2021"
rust-version = "1.88"
description = "A quiet native browser for Omarchy"
license = "MIT"

[dependencies]
gtk = { package = "gtk4", version = "0.10", features = ["v4_10"] }
webkit = { package = "webkit6", version = "0.5", features = ["v2_42"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
toml = "0.8"

[profile.release]
strip = true
lto = "thin"

[profile.dev]
debug = 0
